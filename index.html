    function lockLandscape() {  
        if (screen.orientation &&  
            screen.orientation.lock) {  
            screen.orientation.lock('landscape')  
                .catch(function() {});  
        }  
    }  
  
    document.addEventListener('fullscreenchange', function() {  
        if (document.fullscreenElement) {  
            lockLandscape();  
        }  
    });  
  
    document.addEventListener('DOMContentLoaded', function() {  
        lockLandscape();  
    });  
})();  
</script>

const buildUrl = "Build";  
const loaderUrl = "v11121212.js";  const config = {
dataUrl: "6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
frameworkUrl: "0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
codeUrl: "b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
streamingAssetsUrl: "StreamingAssets",
companyName: "Ericetto",
productName: "Ragdoll Archers",
productVersion: "0.1"
};

const container = document.querySelector("#unity-container");
const canvas = document.querySelector("#unity-canvas");
const loadingCover = document.querySelector("#loading-cover");
const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
const progressBarFull = document.querySelector("#unity-progress-bar-full");

const landscapePopup = document.querySelector("#landscape-popup");
const landscapeClose = document.querySelector("#landscape-close");
const landscapeOK = document.querySelector("#landscape-ok");

let popupDismissed = false;

/* ==============================
LANDSCAPE DETECTION
============================== */

function checkLandscape() {

const isMobile = window.matchMedia("(max-width: 900px)").matches;
const isPortrait = window.matchMedia("(orientation: portrait)").matches;

if (isMobile && isPortrait && !popupDismissed) {
landscapePopup.classList.add("show");
} else {
landscapePopup.classList.remove("show");
}
}

function closeLandscapePopup() {
popupDismissed = true;
landscapePopup.classList.remove("show");
}

landscapeClose.addEventListener("click", closeLandscapePopup);
landscapeOK.addEventListener("click", closeLandscapePopup);

window.addEventListener("orientationchange", checkLandscape);
window.addEventListener("resize", checkLandscape);

checkLandscape();

/* ==============================
LANDSCAPE LOCK
============================== */

async function lockLandscape() {
try {
if (screen.orientation && screen.orientation.lock) {
await screen.orientation.lock("landscape");
}
} catch (error) {
console.log("Landscape lock unavailable:", error);
}
}

/* ==============================
UNITY FULLSCREEN
============================== */

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
container.className = "unity-mobile";
}

loadingCover.style.display = "";

const unityLoader = document.createElement("script");
unityLoader.src = loaderUrl;

unityLoader.onload = () => {

createUnityInstance(canvas, config, (progress) => {

progressBarEmpty.style.display = "";  
progressBarFull.style.width = `${100 * progress}%`;

}).then((unityInstance) => {

window.unityInstance = unityInstance;  
loadingCover.style.display = "none";

}).catch((message) => {

alert(message);

});
};

document.body.appendChild(unityLoader);

/* ==============================
USER INTERACTION
============================== */

document.addEventListener("pointerdown", () => {
container.focus();
window.focus();
canvas.focus();
});

/* ==============================
FULLSCREEN + LANDSCAPE
============================== */

document.addEventListener("fullscreenchange", () => {

if (document.fullscreenElement) {
lockLandscape();
}

checkLandscape();

});
</script>

(function () {  
  'use strict';  
  
  const imageTargets = [  
    {

    {

  ];  
  
  function renderImage(element, src) {  
    if (!element) return;  
  
    const image = new Image();  
  
    image.onload = function () {  
      element.src = src;  
      element.style.display = 'block';  
      element.classList.add('image-rendered');  
    };  
  
    image.onerror = function () {  
      console.error('Image failed to load:', src);  
    };  
  
    image.src = src;  
  }  
  
  function initializeImages() {  
    imageTargets.forEach(function (item) {  
      const element = document.querySelector(item.selector);  
  
      if (element) {  
        element.loading = 'eager';  
        element.decoding = 'async';  
  
        renderImage(element, item.src);  
      }  
    });  
  }  
  
  if (document.readyState === 'loading') {  
    document.addEventListener('DOMContentLoaded', initializeImages);  
  } else {  
    initializeImages();  
  }  
  
})();  
//]]>  
</script>

<script>
(function() {
    const bgm = document.getElementById('appuRagdollBGM');

    if (!bgm) return;

    bgm.volume = 0.75;

    function startBGM() {
        if (!bgm.paused) return;

        bgm.play().catch(function(error) {
            console.log('APPU BGM:', error);
        });
    }

    document.addEventListener('pointerdown', startBGM, {
        passive: true
    });

    document.addEventListener('touchstart', startBGM, {
        passive: true
    });

    document.addEventListener('click', startBGM);

    document.addEventListener('keydown', startBGM);

})();
