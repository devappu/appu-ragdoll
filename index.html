<!DOCTYPE html>
<html lang="en-us">
<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Ragdoll Archers</title>

<link rel="icon" type="image/webp" href="favicon.webp">

<link rel="stylesheet" href="styyyle.css">

<script src="gameloader-helper.js"></script>

<style>

/* =================================
   GLOBAL BACKGROUND
================================= */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000 !important;
}

/* =================================
   APP STAGE
================================= */

#app-stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* =================================
   UNITY CONTAINER
================================= */

#unity-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000 !important;
}

/* =================================
   UNITY CANVAS
================================= */

#unity-canvas {
    position: absolute;
    display: block;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    outline: none;
    background: #000 !important;
}

/* =================================
   LOADING COVER
================================= */

#loading-cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000 !important;
}

/* =================================
   LOADING ELEMENTS
================================= */

#unity-loading-bar {
    background: transparent !important;
}

#unity-logo {
    background: transparent !important;
}

#unity-logo img {
    max-width: 100%;
    height: auto;
}

.progress-spinner-container {
    background: transparent !important;
}

.spinner-left,
.spinner-right {
    background: transparent !important;
}

/* =================================
   LANDSCAPE ROTATION
================================= */

@media screen and (orientation: portrait) and (max-width: 900px) {

    #app-stage {
        width: 100vh;
        height: 100vw;

        top: 0;
        left: 100vw;

        transform: rotate(90deg);
        transform-origin: top left;

        overflow: hidden;
    }

}

/* =================================
   DYNAMIC VIEWPORT
================================= */

@supports (height: 100dvh) {

    #app-stage {
        height: 100dvh;
    }

    @media screen and (orientation: portrait) and (max-width: 900px) {

        #app-stage {
            width: 100dvh;
            height: 100vw;
        }

    }

    @media screen and (orientation: landscape) and (max-width: 900px) {

        #app-stage {
            width: 100vw;
            height: 100dvh;
        }

    }

}

</style>

</head>

<body>

<!-- =================================
     APP STAGE
================================= -->

<div id="app-stage">

    <!-- UNITY CONTAINER -->

    <div id="unity-container" class="unity-desktop">

        <canvas id="unity-canvas" tabindex="-1"></canvas>

    </div>

    <!-- LOADING COVER -->

    <div id="loading-cover">

        <div id="unity-loading-bar">

            <div id="unity-logo">

                <img
                    alt="Ragdoll Archers appu.uk"
                    title="Ragdoll Archers appu.uk"
                    loading="eager"
                    style="margin-bottom:30px;"
                    src="appu-ragdoll-archers.png"
                >

            </div>

            <div class="progress-spinner-container">

                <div class="spinner-left">

                    <img
                        alt="Ragdoll Archers Spinner"
                        src="1793852318882.png"
                    >

                </div>

                <div id="unity-progress-bar-empty">

                    <div id="unity-progress-bar-full"></div>

                </div>

                <div class="spinner-right">

                    <img
                        alt="Ragdoll Archers Spinner"
                        src="1793852318882.png"
                    >

                </div>

            </div>

        </div>

    </div>

</div>

<!-- =================================
     UNITY INITIALIZATION
================================= -->

<script>

const buildUrl = "Build";

const loaderUrl = "v11121212.js";

const config = {

    dataUrl: "6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",

    frameworkUrl: "0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",

    codeUrl: "b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",

    streamingAssetsUrl: "StreamingAssets",

    companyName: "Ericetto",

    productName: "Ragdoll Archers",

    productVersion: "0.1",

    matchWebGLToCanvasSize: true,

    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)

};

/* =================================
   ELEMENT REFERENCES
================================= */

const stage = document.querySelector("#app-stage");

const container = document.querySelector("#unity-container");

const canvas = document.querySelector("#unity-canvas");

const loadingCover = document.querySelector("#loading-cover");

const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");

const progressBarFull = document.querySelector("#unity-progress-bar-full");

/* =================================
   MOBILE DETECTION
================================= */

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

    container.classList.add("unity-mobile");

}

/* =================================
   PROPORTIONAL CANVAS
================================= */

/*
   Target aspect ratio: 16:9

   Canvas selalu mempertahankan proporsi.
   Area kosong menggunakan background hitam.
*/

const GAME_ASPECT = 16 / 9;

function resizeGameCanvas() {

    const stageWidth = stage.clientWidth;

    const stageHeight = stage.clientHeight;

    if (!stageWidth || !stageHeight) return;

    let width = stageWidth;

    let height = width / GAME_ASPECT;

    if (height > stageHeight) {

        height = stageHeight;

        width = height * GAME_ASPECT;

    }

    canvas.style.width = width + "px";

    canvas.style.height = height + "px";

}

window.addEventListener("resize", resizeGameCanvas);

window.addEventListener("orientationchange", function() {

    setTimeout(resizeGameCanvas, 150);

});

if (window.visualViewport) {

    window.visualViewport.addEventListener("resize", resizeGameCanvas);

}

resizeGameCanvas();

/* =================================
   LANDSCAPE LOCK
================================= */

async function requestLandscape() {

    try {

        if (!document.fullscreenElement &&
            document.documentElement.requestFullscreen) {

            await document.documentElement.requestFullscreen();

        }

    } catch (error) {

        console.log("Fullscreen unavailable:", error);

    }

    try {

        if (screen.orientation &&
            screen.orientation.lock) {

            await screen.orientation.lock("landscape");

        }

    } catch (error) {

        console.log("Landscape lock unavailable:", error);

    }

    resizeGameCanvas();

}

/* =================================
   USER INTERACTION
================================= */

document.addEventListener("pointerdown", function() {

    container.focus();

    window.focus();

    canvas.focus();

    requestLandscape();

}, { once: true });

/* =================================
   UNITY LOADER
================================= */

loadingCover.style.display = "";

const unityLoader = document.createElement("script");

unityLoader.src = loaderUrl;

unityLoader.onload = function() {

    createUnityInstance(

        canvas,

        config,

        function(progress) {

            progressBarEmpty.style.display = "";

            progressBarFull.style.width =
                (100 * progress) + "%";

        }

    ).then(function(unityInstance) {

        window.unityInstance = unityInstance;

        resizeGameCanvas();

        loadingCover.style.display = "none";

    }).catch(function(message) {

        alert(message);

    });

};

unityLoader.onerror = function() {

    alert("Unity loader failed to load.");

};

document.body.appendChild(unityLoader);

/* =================================
   FULLSCREEN CHANGE
================================= */

document.addEventListener("fullscreenchange", function() {

    setTimeout(resizeGameCanvas, 100);

});

</script>

<!-- =================================
     IMAGE RENDERER
================================= -->

<script>

//<![CDATA[

(function() {

    'use strict';

    const imageTargets = [

        {
            selector: '#unity-logo img',
            src: 'logo.jpeg'
        },

        {
            selector: '.spinner-left img',
            src: '1793852318882.png'
        },

        {
            selector: '.spinner-right img',
            src: '1793852318882.png'
        }

    ];

    function renderImage(element, src) {

        if (!element) return;

        const image = new Image();

        image.onload = function() {

            element.src = src;

            element.style.display = 'block';

            element.classList.add('image-rendered');

        };

        image.onerror = function() {

            console.error('Image failed to load:', src);

        };

        image.src = src;

    }

    function initializeImages() {

        imageTargets.forEach(function(item) {

            const element = document.querySelector(item.selector);

            if (element) {

                element.loading = 'eager';

                element.decoding = 'async';

                renderImage(element, item.src);

            }

        });

    }

    if (document.readyState === 'loading') {

        document.addEventListener(
            'DOMContentLoaded',
            initializeImages
        );

    } else {

        initializeImages();

    }

})();

//]]>

</script>

</body>
</html>
